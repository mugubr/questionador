name: Deploy to GitHub Pages

on:
  # Only after CI is green on the default branch. `workflow_run` fires on
  # completion, so the conclusion is checked before anything is published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a running deployment: a half-published site is worse than a
  # queued one.
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs/
    # workflow_dispatch is a deliberate maintainer override, not a second
    # normal path: it does not check CI at all, so it can publish a commit CI
    # has not seen or has failed on. The warning step below exists so that
    # bypass is loud in the run log instead of indistinguishable from the
    # normal, CI-gated deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Warn when deploying without a CI gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::warning::Manual dispatch skips the CI gate -- this deploy has not been confirmed to pass ruff/mypy/pytest/node test/tsc/validate on this ref."

      - name: Check out the commit CI passed on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload docs/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Only this directory. The repository root would carry exams/ and
          # references/ with it — 50 MB of third-party PDFs that must never be
          # published.
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
