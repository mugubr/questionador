<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Questionador PROFNIT">
  <style>
    /* The favicon follows the browser chrome, not the page: tabs are painted
       by the operating system theme, which is what prefers-color-scheme
       reports here. */
    :root { --sheet: #f9f6f1; --ink: #221b16; --accent: #0059a2; }
    @media (prefers-color-scheme: dark) {
      :root { --sheet: #27201b; --ink: #e8e4dd; --accent: #73b6fa; }
    }
  </style>
  <rect width="64" height="64" rx="12" fill="var(--sheet)"/>
  <rect x="12" y="8" width="40" height="48" rx="4" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <path d="M24 26h16M24 36h10" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="44" r="11" fill="var(--accent)"/>
  <path d="M40.4 40.6a3.7 3.7 0 1 1 3.9 5.2v1.6" fill="none" stroke="var(--sheet)"
        stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="44.3" cy="50.4" r="1.6" fill="var(--sheet)"/>
</svg>
